# otop palette (see otop.md at the repo root)

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$cmd_duration\
$line_break\
$character"""

right_format = """$time"""

add_newline = true

palette = "otop"

[palettes.otop]
red     = "#f05050"
green   = "#50f095"
yellow  = "#f0c050"
blue    = "#4897d4"
magenta = "#ff40b6"
teal    = "#5f8787"
text    = "#bcbcbc"

[username]
show_always = true
style_user  = "bold green"
style_root  = "bold red"
format      = "[$user]($style)"

[hostname]
ssh_only = false
style    = "bold teal"
format   = "[@$hostname]($style) "
trim_at  = ""

[directory]
style             = "bold yellow"
truncation_length = 3
truncate_to_repo  = true
read_only         = " 󰌾"
read_only_style   = "red"
format            = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style  = "bold blue"
format = "[$symbol$branch]($style) "

[git_status]
style      = "red"
format     = "([$all_status$ahead_behind]($style) )"
conflicted = "⚡"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?${count}"
stashed    = "󰏗 "
modified   = "!${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "✘${count}"

[python]
symbol = " "
style  = "yellow"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style  = "green"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style  = "red"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2_000
style    = "text"
format   = "[ $duration]($style) "

[time]
disabled    = false
style       = "teal"
format      = "[$time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold yellow)"

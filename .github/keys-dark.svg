<svg xmlns="http://www.w3.org/2000/svg" width="836" height="241" viewBox="0 0 836 241" role="img" aria-label="keybinds">
  <rect x="0" y="0" width="836" height="241" fill="#0d1117"/>
  <rect x="1" y="81" width="834" height="40" fill="#151b23"/>
  <rect x="1" y="161" width="834" height="40" fill="#151b23"/>
  <g stroke="#3d444d">
    <rect x="0.5" y="0.5" width="835" height="240" fill="none"/>
    <line x1="1" y1="40.5" x2="835" y2="40.5"/>
    <line x1="1" y1="80.5" x2="835" y2="80.5"/>
    <line x1="1" y1="120.5" x2="835" y2="120.5"/>
    <line x1="1" y1="160.5" x2="835" y2="160.5"/>
    <line x1="1" y1="200.5" x2="835" y2="200.5"/>
    <line x1="232.5" y1="1" x2="232.5" y2="240"/>
    <line x1="418.5" y1="1" x2="418.5" y2="240"/>
    <line x1="575.5" y1="1" x2="575.5" y2="240"/>
  </g>
  <g font-size="13" font-weight="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#f0f6fc">
    <text x="13" y="25">keybind</text>
    <text x="245" y="25">action</text>
    <text x="431" y="25">keybind</text>
    <text x="587" y="25">action</text>
  </g>
  <g font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f0f6fc">
    <text x="13" y="65" textLength="206" lengthAdjust="spacingAndGlyphs">ctrl+shift+enter / alt+enter</text>
    <text x="13" y="105" textLength="126" lengthAdjust="spacingAndGlyphs">ctrl+shift+arrows</text>
    <text x="13" y="145" textLength="74" lengthAdjust="spacingAndGlyphs">alt+arrows</text>
    <text x="13" y="185" textLength="155" lengthAdjust="spacingAndGlyphs">ctrl+shift+q / ctrl+w</text>
    <text x="13" y="225" textLength="126" lengthAdjust="spacingAndGlyphs">ctrl+t, ctrl+1..9</text>
    <text x="431" y="65" textLength="45" lengthAdjust="spacingAndGlyphs">ctrl+f</text>
    <text x="431" y="105" textLength="118" lengthAdjust="spacingAndGlyphs">ctrl+shift+c / v</text>
    <text x="431" y="145" textLength="24" lengthAdjust="spacingAndGlyphs">F11</text>
    <text x="431" y="185" textLength="45" lengthAdjust="spacingAndGlyphs">ctrl+r</text>
    <text x="431" y="225" textLength="74" lengthAdjust="spacingAndGlyphs">ctrl+alt+f</text>
  </g>
  <g font-size="13" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#f0f6fc">
    <text x="245" y="65">split pane right / down</text>
    <text x="245" y="105">move between panes</text>
    <text x="245" y="145">resize pane</text>
    <text x="245" y="185">close pane / tab</text>
    <text x="245" y="225">new tab, jump to tab</text>
    <text x="587" y="65">search scrollback</text>
    <text x="587" y="105">copy / paste</text>
    <text x="587" y="145">fullscreen</text>
    <text x="587" y="185">fuzzy history search (fish)</text>
    <text x="587" y="225">fuzzy file finder (fish)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="836" height="201" viewBox="0 0 836 201" role="img" aria-label="keybindings">
  <rect x="0" y="0" width="836" height="201" fill="#0d1117"/>
  <rect x="1" y="41" width="834" height="40" fill="#151b23"/>
  <rect x="1" y="121" width="834" height="40" fill="#151b23"/>
  <g stroke="#3d444d">
    <rect x="0.5" y="0.5" width="835" height="200" fill="none"/>
    <line x1="1" y1="40.5" x2="835" y2="40.5"/>
    <line x1="1" y1="80.5" x2="835" y2="80.5"/>
    <line x1="1" y1="120.5" x2="835" y2="120.5"/>
    <line x1="1" y1="160.5" x2="835" y2="160.5"/>
    <line x1="215.5" y1="1" x2="215.5" y2="200"/>
    <line x1="418.5" y1="1" x2="418.5" y2="200"/>
    <line x1="558.5" y1="1" x2="558.5" y2="200"/>
  </g>
  <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f0f6fc">
    <text x="13" y="25">ctrl+shift+enter / alt+enter</text>
    <text x="13" y="65">ctrl+shift+arrows</text>
    <text x="13" y="105">alt+arrows</text>
    <text x="13" y="145">ctrl+shift+q / ctrl+w</text>
    <text x="13" y="185">ctrl+t, ctrl+1..9</text>
    <text x="431" y="25">ctrl+f</text>
    <text x="431" y="65">ctrl+shift+c / v</text>
    <text x="431" y="105">F11</text>
    <text x="431" y="145">ctrl+r</text>
    <text x="431" y="185">ctrl+alt+f</text>
  </g>
  <g font-size="13" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#f0f6fc">
    <text x="228" y="25">split pane right / down</text>
    <text x="228" y="65">move between panes</text>
    <text x="228" y="105">resize pane</text>
    <text x="228" y="145">close pane / tab</text>
    <text x="228" y="185">new tab, jump to tab</text>
    <text x="571" y="25">search scrollback</text>
    <text x="571" y="65">copy / paste</text>
    <text x="571" y="105">fullscreen</text>
    <text x="571" y="145">fuzzy history search (fish)</text>
    <text x="571" y="185">fuzzy file finder (fish)</text>
  </g>
</svg>
